{% extends "find_coupon.html" %}
{% block sms %}
<div class="mt-3"></div>
<div class="form-floating">
  <select class="form-select" id="discountSelect" aria-label="Option to select discount value">
    <option selected value="100">100</option>
    <option value="110">110</option>
    <option value="120">120</option>
    <option value="130">130</option>
    <option value="140">140</option>
    <option value="150">150</option>
    <option value="160">160</option>
    <option value="170">170</option>
    <option value="180">180</option>
    <option value="190">190</option>
    <option value="200">200</option>
    <option value="210">210</option>
    <option value="220">220</option>
    <option value="230">230</option>
    <option value="240">240</option>
    <option value="250">250</option>
    <option value="260">260</option>
    <option value="270">270</option>
    <option value="280">280</option>
    <option value="290">290</option>
    <option value="300">300</option>
  </select>
  <label for="floatingSelect">給予折扣</label>
</div>
<div class="mt-3"></div>
<div class="form-floating mb-3 position-relative">
  <textarea class="form-control" placeholder="Leave a comment here" id="discountTextarea"
    style="height: 140px; padding-right: 70px;">
提供您老客戶折扣碼可分享給計畫租借的朋友或下次使用
折價券兌換碼：{{result.get_coupon_code()}}
使用期限{{result.get_expiry_date()}}，一筆訂單可使用一組，滿額最高可抵用100元租金
詳細辦法請參考 https://zuzoo.page.link/coupon</textarea>
  <label for="discountTextarea">折扣碼訊息</label>
  <button class="btn btn-sm btn-outline-secondary position-absolute top-0 end-0 mt-3 me-3" type="button"
    style="z-index: 5;" onclick="copyToClipboard('discountTextarea', this)">Copy</button>
</div>

<div class="form-floating mb-3 position-relative">
  <textarea class="form-control" placeholder="Leave a comment here" id="reviewTextarea"
    style="height: 100px; padding-right: 70px;">
如覺得服務不錯，歡迎在Google給好評價，謝謝您：https://g.page/zuzoo/review?gm</textarea>
  <label for="reviewTextarea">評價提醒</label>
  <button class="btn btn-sm btn-outline-secondary position-absolute top-0 end-0 mt-3 me-3" type="button"
    style="z-index: 5;" onclick="copyToClipboard('reviewTextarea', this)">Copy</button>
</div>
{% endblock %}

{% block script %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const discountSelect = document.getElementById('discountSelect');

    if (discountSelect) {
      discountSelect.addEventListener('change', function () {
        const newVal = this.value;

        // 更新折扣碼訊息內的金額
        const discountTextarea = document.getElementById('discountTextarea');
        if (discountTextarea) {
          discountTextarea.value = discountTextarea.value.replace(/滿額最高可抵用\d+元租金/, '滿額最高可抵用' + newVal + '元租金');
        }

        // 更新 Notes 內的金額
        const notesInput = document.querySelector('input[name="notes"]');
        if (notesInput) {
          notesInput.value = notesInput.value.replace(/可抵用主商品\d+元租金/, '可抵用主商品' + newVal + '元租金');
        }
      });
    }
  });

  function copyToClipboard(elementId, btnElement) {
    const copyText = document.getElementById(elementId);
    copyText.select();
    copyText.setSelectionRange(0, 99999); // For mobile devices
    navigator.clipboard.writeText(copyText.value).then(() => {
      const originalText = btnElement.innerText;
      btnElement.innerText = 'Copied!';
      setTimeout(() => {
        btnElement.innerText = originalText;
      }, 2000);
    }).catch(err => {
      console.error('Failed to copy text: ', err);
    });
  }
</script>
{% endblock %}
